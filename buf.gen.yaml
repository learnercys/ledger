# Generated code is committed so the project builds without buf installed.
# Regenerate with `make generate`.
version: v2
clean: true
plugins:
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative
      - simple # handlers take and return plain messages
